# Same fast pipeline, reduced model/data/token budgets for CPU smoke verification.
seed: 42
paths:
  raw: data/raw/rus.txt
  processed: data/processed/fast_cpu
  checkpoints: checkpoints/transformer_fast_cpu
  results: results/transformer_fast_cpu
data:
  max_train: 256
  max_val: 32
  max_test: 40
tokenizer:
  vocab_size: 256
model:
  d_model: 32
  heads: 4
  layers: 1
  d_ff: 64
  dropout: 0.1
  max_length: 24
training:
  device: cpu
  cpu_threads: 2
  max_tokens: 1024
  max_sentences: 32
  bucket_size: 8192
  num_workers: 2
  pin_memory: false
  prefetch_factor: 2
  epochs: 2
  warmup_steps: 16
  label_smoothing: 0.1
  gradient_clip: 1.0
  mixed_precision: false
  patience: 3
  min_delta: 0.001
  progress: true
  log_every: 2
evaluation:
  val_greedy_samples: 16
  batch_size: 16
  beam_size: 3
  beam_batch_size: 8
  beam_max_sources: 16
  length_penalty: 0.6
