# Larger scratch model; start a new run, never resume a fast-model checkpoint.
seed: 42
paths:
  raw: data/raw/rus.txt
  processed: data/processed/colab_large
  checkpoints: checkpoints/transformer_colab_large
  results: results/transformer_colab_large
data:
  max_train: null
  max_val: null
  max_test: null
tokenizer:
  vocab_size: 16000
model:
  d_model: 512
  heads: 8
  layers: 6
  d_ff: 2048
  dropout: 0.1
  max_length: 64
training:
  device: cuda
  cpu_threads: 2
  max_tokens: 32768
  max_sentences: 2048
  bucket_size: 8192
  num_workers: 2
  pin_memory: true
  prefetch_factor: 2
  epochs: 30
  warmup_steps: 500
  lr_factor: 0.5
  label_smoothing: 0.1
  gradient_clip: 1.0
  mixed_precision: true
  patience: 5
  min_delta: 0.001
  progress: true
  log_every: 10
evaluation:
  val_greedy_samples: 128
  batch_size: 128
  beam_size: 4
  beam_batch_size: 64
  beam_max_sources: null
  report_greedy: true
  repetition_ablation_ngram: 3
  length_penalty: 0.6
