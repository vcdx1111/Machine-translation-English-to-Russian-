# Reduced architecture/data for large-preset full beam/greedy/repetition pipeline validation.
seed: 42
paths:
  raw: data/raw/rus.txt
  processed: data/processed/large_cpu
  checkpoints: checkpoints/large_cpu
  results: results/large_cpu
data:
  max_train: 96
  max_val: 16
  max_test: 40
tokenizer:
  vocab_size: 256
model:
  d_model: 32
  heads: 4
  layers: 1
  d_ff: 64
  dropout: 0.1
  max_length: 32
training:
  device: cpu
  cpu_threads: 2
  max_tokens: 1024
  max_sentences: 32
  bucket_size: 8192
  num_workers: 0
  pin_memory: false
  prefetch_factor: 2
  epochs: 2
  warmup_steps: 8
  lr_factor: 0.5
  label_smoothing: 0.1
  gradient_clip: 1.0
  mixed_precision: false
  patience: 5
  min_delta: 0.001
  progress: false
  log_every: 10
evaluation:
  val_greedy_samples: 8
  batch_size: 16
  beam_size: 4
  beam_batch_size: 8
  beam_max_sources: null
  report_greedy: true
  repetition_ablation_ngram: 3
  length_penalty: 0.6
